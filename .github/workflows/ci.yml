# ExtCircuitJS CI（A04）
# 双平台：doctor + build + plugin lint + cover scan + Node 侧契约测试。
# 构建产物 dist/ 作为 artifact 上传（每个平台一份），部署走独立的 pages.yml（GitHub Pages，仅 main）。
# 浏览器契约测试（tests/contract/*.browser.* 与 *.browser.mjs）需要本机 Chrome +
# playwright-core（EXT_PW_CORE/EXT_CHROME 指向本机路径），仅在开发机跑，见 docs/development-plan.md。

name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install core dependencies
        run: npm install --no-audit --no-fund --prefix core/ts

      - name: Doctor
        run: node tools/ext.mjs doctor

      - name: Build (tsc core + tsc cover + vite)
        run: node tools/ext.mjs build

      - name: Upload dist (static bundle)
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist
          retention-days: 7

      - name: Plugin lint
        run: node tools/ext.mjs plugin lint

      - name: Cover scan
        run: node tools/ext.mjs cover scan --json build/cover-scan.json

      - name: Contract tests (Node-side, no browser)
        # 只列不依赖浏览器的文件：*.browser.test.mjs 需要本机 Chrome + playwright-core，
        # 不能在 runner 上跑（见 docs/development-plan.md）。新增纯 Node 契约记得加到这里。
        run: >
          node --test
          tests/contract/element-factory.test.mjs
          tests/contract/ops.test.mjs
          tests/contract/netlist-ids.test.mjs
          tests/contract/fiber.test.mjs
          tests/contract/events.test.mjs
          tests/contract/mcp-session.test.mjs
          tests/contract/mcp-stdio.test.mjs
          tests/contract/site-config.test.mjs
          tests/contract/hooks.test.mjs
          tests/contract/permissions.test.mjs
          tests/contract/element-events.test.mjs
          tests/contract/netlist-compact.test.mjs
          tests/contract/compile.test.mjs

  browser:
    # 浏览器契约（真实 Chromium + dev server）：双平台各跑一遍。
    # playwright-core 在 CI 现装并写到 core/ts/node_modules；契约测试的 EXT_PW_CORE 默认值
    # 指向开发机绝对路径（D:\DevEnv\...），CI 上必须显式覆盖为 repo 内路径，否则 existsSync 全挂。
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      EXT_PW_CORE: ${{ github.workspace }}/core/ts/node_modules/playwright-core/index.mjs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install core dependencies
        run: npm install --no-audit --no-fund --prefix core/ts

      - name: Install playwright-core (for browser contracts)
        working-directory: core/ts
        run: npm install --no-audit --no-fund --no-save playwright-core

      - name: Set Chrome path for non-Windows
        if: runner.os != 'Windows'
        run: >
          echo "EXT_CHROME=$(command -v google-chrome || command -v google-chrome-stable || echo /usr/bin/google-chrome)"
          >> "$GITHUB_ENV"

      - name: Start dev server (background)
        run: |
          node tools/ext.mjs dev --port 5174 > /tmp/dev.log 2>&1 &
          echo $! > /tmp/dev.pid
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:5174/circuitjs.html; then echo "dev server up"; exit 0; fi
            sleep 2
          done
          echo "dev server failed to start"; cat /tmp/dev.log; exit 1

      - name: Run browser contracts (serial, port 5174)
        run: |
          set -e
          for t in tests/contract/*.browser.mjs tests/contract/*.browser.test.mjs; do
            echo "=== $t ==="
            node "$t"
          done
        timeout-minutes: 30
